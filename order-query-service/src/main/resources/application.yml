spring:
  application:
    name: order-query-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/query_db}
    username: ${DB_USER:query_owner}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 8
      connection-timeout: 3000
  flyway:
    enabled: true
  jackson:
    deserialization:
      accept-float-as-int: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: order-projection-v1
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        max.poll.records: 10
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1
        max.block.ms: 1000
        request.timeout.ms: 2000
        delivery.timeout.ms: 4000
    listener:
      ack-mode: record
      auto-startup: ${QUERY_LISTENER_ENABLED:true}
  threads:
    virtual:
      enabled: true
server:
  port: ${SERVER_PORT:8089}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
logging:
  structured:
    format:
      console: ecs
demo:
  auth:
    customer-password: ${DEMO_CUSTOMER_PASSWORD}
    second-customer-password: ${DEMO_SECOND_CUSTOMER_PASSWORD}
    admin-password: ${DEMO_ADMIN_PASSWORD}
projection:
  rebuild:
    enabled: ${PROJECTION_REBUILD_ENABLED:true}
    poll-delay-ms: 500
    batch-size: 100
details:
  payment-url: ${PAYMENT_SERVICE_URL:http://localhost:8086}
  inventory-url: ${INVENTORY_SERVICE_URL:http://localhost:8085}
  shipping-url: ${SHIPPING_SERVICE_URL:http://localhost:8087}
  timeout-ms: ${DETAILS_TIMEOUT_MS:1000}
  max-concurrent-lookups: ${DETAILS_MAX_CONCURRENT_LOOKUPS:24}
