spring:
  application:
    name: cart-service
  jackson:
    deserialization:
      accept-float-as-int: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cart_db}
    username: ${DB_USER:cart_owner}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  threads:
    virtual:
      enabled: true
server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
logging:
  structured:
    format:
      console: ecs
demo:
  auth:
    customer-password: ${DEMO_CUSTOMER_PASSWORD}
    second-customer-password: ${DEMO_SECOND_CUSTOMER_PASSWORD}
    admin-password: ${DEMO_ADMIN_PASSWORD}
catalog:
  base-url: ${PRODUCT_SERVICE_URL:http://localhost:8081}
