spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: products
              uri: ${PRODUCT_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/products,/api/products/**
            - id: carts
              uri: ${CART_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/carts,/api/carts/**
            - id: payments
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/payments,/api/payments/**
            - id: inventory
              uri: ${INVENTORY_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/inventory,/api/inventory/**
            - id: orders
              uri: ${ORDER_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/orders,/api/orders/**
  threads:
    virtual:
      enabled: true
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
logging:
  structured:
    format:
      console: ecs
