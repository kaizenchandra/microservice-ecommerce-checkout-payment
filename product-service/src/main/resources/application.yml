spring:
  application:
    name: product-service
  jackson:
    deserialization:
      accept-float-as-int: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/product_db}
    username: ${DB_USER:product_owner}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true
server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
logging:
  structured:
    format:
      console: ecs
demo:
  auth:
    customer-password: ${DEMO_CUSTOMER_PASSWORD}
    second-customer-password: ${DEMO_SECOND_CUSTOMER_PASSWORD}
    admin-password: ${DEMO_ADMIN_PASSWORD}
security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:checkout-demo}
    audience: ${JWT_AUDIENCE:ecommerce-api}
telemetry:
  export-enabled: ${TELEMETRY_EXPORT_ENABLED:true}
  endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
