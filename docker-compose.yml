      test: ["CMD", "/healthcheck", "http://localhost:8086/actuator/health/readiness"]

  shipping-service:
    <<: *runtime
    build: {context: ., dockerfile: shipping-service/Dockerfile}
    environment:
      <<: *app-env
      SERVER_PORT: 8087
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shipping_db
      SPRING_DATASOURCE_USERNAME: shipping_owner
      SPRING_DATASOURCE_PASSWORD: ${SHIPPING_DB_PASSWORD:?Run the environment initializer}
    depends_on:
