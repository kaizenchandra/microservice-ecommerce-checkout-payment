      test: ["CMD", "/healthcheck", "http://localhost:8083/actuator/health/readiness"]

  order-service:
    <<: *runtime
    build: {context: ., dockerfile: order-service/Dockerfile}
    environment:
      <<: *app-env
      SERVER_PORT: 8084
