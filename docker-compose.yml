      DEMO_SECOND_CUSTOMER_PASSWORD: ${DEMO_SECOND_CUSTOMER_PASSWORD:?Run the environment initializer}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?Run the environment initializer}
      DEMO_CHECKOUT_PASSWORD: ${DEMO_CHECKOUT_PASSWORD:?Run the environment initializer}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/order_db
