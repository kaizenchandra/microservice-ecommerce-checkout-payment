    environment:
      <<: *app-env
      SERVER_PORT: 8086
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment_db
      SPRING_DATASOURCE_USERNAME: payment_owner
      SPRING_DATASOURCE_PASSWORD: ${PAYMENT_DB_PASSWORD:?Run the environment initializer}
    depends_on:
      postgres: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
