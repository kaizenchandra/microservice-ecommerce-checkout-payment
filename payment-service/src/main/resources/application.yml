spring:
  application:
    name: payment-service
  threads:
    virtual:
      enabled: true
server:
  port: ${SERVER_PORT:8086}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
logging:
  structured:
    format:
      console: ecs
