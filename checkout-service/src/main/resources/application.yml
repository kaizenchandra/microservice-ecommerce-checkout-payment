spring:
  application:
    name: checkout-service
  threads:
    virtual:
      enabled: true
server:
  port: ${SERVER_PORT:8083}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
logging:
  structured:
    format:
      console: ecs
security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:checkout-demo}
    audience: ${JWT_AUDIENCE:ecommerce-api}
telemetry:
  export-enabled: ${TELEMETRY_EXPORT_ENABLED:true}
  endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
